<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videomaker Mobile | Débora Dominique</title>
<meta name="description" content="Vídeos para o seu negócio gravados no celular, com edição profissional. Pacotes de videomaker mobile em Belo Horizonte.">
<meta property="og:title" content="Videomaker Mobile | Débora Dominique">
<meta property="og:description" content="Vídeos para o seu negócio, gravados no local e editados para Reels.">
<meta property="og:image" content="https://deboradominique.com/img/og.jpg">
<meta name="theme-color" content="#6e1423">
<link rel="icon" href="../img/icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icone-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --vinho: #6e1423;
    --vinho-escuro: #3d0b14;
    --creme: #f1e6cf;
    --creme-claro: #f7f0e1;
    --papel: #fbf7ef;
    --dourado: #c9a86a;
    --marrom: #2a1a14;
    --texto-suave: #6b5446;
    --borda: rgba(110, 20, 35, .12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: 'Inter', system-ui, sans-serif; color: var(--marrom); line-height: 1.5; min-height: 100vh;
    background: radial-gradient(120% 60% at 50% 0%, var(--papel) 0%, var(--creme-claro) 45%, var(--creme) 100%);
    background-color: var(--creme);
  }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--dourado); outline-offset: 3px; border-radius: 10px; }
  svg { width: 20px; height: 20px; fill: currentColor; flex-shrink: 0; }

  .pagina { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

  .voltar { display: inline-flex; align-items: center; gap: 6px; font-size: .82rem; font-weight: 500; color: var(--texto-suave); padding: 6px 0; }
  .voltar:hover { color: var(--vinho); }
  .voltar svg { width: 16px; height: 16px; }

  /* TOPO */
  .topo { text-align: center; margin-top: 18px; }
  .foto {
    width: 76px; height: 76px; border-radius: 50%; object-fit: cover; display: block; margin: 0 auto 14px;
    border: 3px solid var(--papel); box-shadow: 0 0 0 1.5px var(--dourado), 0 10px 24px rgba(61, 11, 20, .16);
  }
  .sobrelinha { font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--vinho); }
  h1 { margin-top: 8px; font-family: 'Playfair Display', serif; font-weight: 500; font-size: 2.1rem; line-height: 1.15; color: var(--vinho); }
  h1 em { color: var(--dourado); }
  .subtitulo { margin: 12px auto 0; max-width: 36ch; color: var(--texto-suave); font-size: .95rem; }

  /* BLOCOS */
  .bloco { margin-top: 36px; }
  .rotulo {
    display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    font-size: .68rem; letter-spacing: .22em; text-transform: uppercase; font-weight: 600; color: var(--vinho);
  }
  .rotulo::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--dourado), transparent); opacity: .7; }

  /* PARA QUEM */
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 18px; }
  .tags span { padding: 6px 12px; border-radius: 99px; border: 1px solid var(--borda); background: var(--papel); font-size: .78rem; color: var(--texto-suave); }

  .email-topo {
    display: flex; width: fit-content; max-width: 100%; align-items: center; gap: 8px; margin: 16px auto 0; padding: 8px 16px; border-radius: 99px;
    border: 1px solid var(--dourado); background: var(--papel); color: var(--vinho); font-size: .88rem; font-weight: 600;
    transition: background .2s ease;
  }
  .email-topo:hover { background: rgba(201, 168, 106, .15); }
  .email-topo svg { width: 18px; height: 18px; color: var(--dourado); }

  /* COMO FUNCIONA */
  .passos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .passo { padding: 14px 10px; border-radius: 16px; background: var(--papel); border: 1px solid var(--borda); text-align: center; }
  .passo b { display: grid; place-items: center; width: 28px; height: 28px; margin: 0 auto 8px; border-radius: 50%; background: var(--vinho); color: var(--creme-claro); font-family: 'Playfair Display', serif; font-size: .9rem; }
  .passo strong { display: block; font-size: .82rem; font-weight: 600; }
  .passo span { display: block; margin-top: 2px; font-size: .72rem; color: var(--texto-suave); line-height: 1.35; }

  /* PACOTES */
  .pacotes { display: grid; gap: 14px; }
  .pacote { position: relative; padding: 20px; border-radius: 20px; background: var(--papel); border: 1px solid var(--borda); }
  .pacote.destaque {
    background: linear-gradient(135deg, var(--vinho) 0%, var(--vinho-escuro) 100%); color: var(--creme-claro); border: 0;
    box-shadow: 0 14px 34px rgba(61, 11, 20, .25);
  }
  .etiqueta {
    display: inline-block; margin-bottom: 10px; padding: 3px 9px; border-radius: 99px;
    background: var(--dourado); color: var(--marrom); font-size: .6rem; letter-spacing: .14em; font-weight: 600; text-transform: uppercase;
  }
  .cabeca { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .pacote h3 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.35rem; line-height: 1.2; }
  .pacote .resumo { display: block; margin-top: 2px; font-size: .82rem; color: var(--texto-suave); }
  .preco { text-align: right; white-space: nowrap; }
  .preco small { display: block; font-size: .6rem; letter-spacing: .14em; text-transform: uppercase; color: var(--texto-suave); }
  .preco b { font-family: 'Playfair Display', serif; font-weight: 600; font-size: 1.45rem; color: var(--vinho); }
  .preco b i { font-style: normal; font-family: 'Inter', sans-serif; font-size: .7rem; font-weight: 500; }
  .itens { list-style: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--borda); display: grid; gap: 8px; }
  .itens li { display: flex; gap: 10px; align-items: flex-start; font-size: .87rem; }
  .itens svg { width: 16px; height: 16px; margin-top: 3px; color: var(--dourado); }
  .quero {
    display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 18px; padding: 13px; border-radius: 14px;
    background: var(--vinho); color: var(--creme-claro); font-size: .9rem; font-weight: 600; transition: background .2s ease;
  }
  .quero:hover { background: var(--vinho-escuro); }
  .quero svg { width: 18px; height: 18px; }
  .pacote.destaque .resumo, .pacote.destaque .preco small { color: rgba(247, 240, 225, .75); }
  .pacote.destaque .preco b { color: var(--dourado); }
  .pacote.destaque .itens { border-top-color: rgba(201, 168, 106, .3); }
  .pacote.destaque .quero { background: var(--dourado); color: var(--marrom); }
  .pacote.destaque .quero:hover { background: var(--creme); }

  /* INCLUSO */
  .incluso { padding: 18px 20px; border-radius: 18px; background: var(--papel); border: 1px solid var(--borda); display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .incluso li { list-style: none; display: flex; gap: 8px; font-size: .82rem; }
  .incluso svg { width: 16px; height: 16px; margin-top: 2px; color: var(--dourado); }

  .observacao { margin-top: 14px; text-align: center; font-size: .78rem; color: var(--texto-suave); }

  /* CHAMADA FINAL */
  .final {
    margin-top: 36px; padding: 24px 20px; border-radius: 20px; text-align: center;
    background: var(--papel); border: 1px solid var(--dourado);
  }
  .final strong { display: block; font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.35rem; line-height: 1.25; color: var(--vinho); }
  .final span { display: block; margin-top: 6px; font-size: .86rem; color: var(--texto-suave); }

  /* BOTÃO FIXO: Personalize seu pacote (aparece ao rolar) */
  .fixo {
    position: fixed; left: 50%; bottom: 16px; z-index: 10; width: calc(100% - 32px); max-width: 448px;
    display: flex; justify-content: center; align-items: center; gap: 8px; padding: 15px; border-radius: 99px;
    background: linear-gradient(135deg, var(--vinho) 0%, var(--vinho-escuro) 100%); color: var(--creme-claro);
    font-weight: 600; font-size: .95rem; box-shadow: 0 12px 30px rgba(61, 11, 20, .35), 0 0 0 1px rgba(201, 168, 106, .5);
    transform: translate(-50%, 140%); transition: transform .35s ease;
  }
  .fixo.visivel { transform: translate(-50%, 0); }
  .fixo svg { width: 18px; height: 18px; color: var(--dourado); }
  .pagina { padding-bottom: 96px; }

  .rodape { text-align: center; margin-top: 28px; font-size: .66rem; letter-spacing: .2em; text-transform: uppercase; color: var(--texto-suave); opacity: .8; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<main class="pagina">

  <a class="voltar" href="../">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Voltar para os links
  </a>

  <header class="topo">
    <img class="foto" src="../img/foto.jpg" alt="Débora Dominique" width="76" height="76">
    <p class="sobrelinha">Videomaker Mobile</p>
    <h1>Vídeos que fazem o seu negócio <em>ser visto.</em></h1>
    <p class="subtitulo" id="subtitulo"></p>
    <div class="tags" id="tags"></div>
    <a class="email-topo" id="emailTopo" data-goatcounter-click="videomaker-email-topo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zm9 7.2L4.4 7H4v.6l8 5.6 8-5.6V7h-.4L12 12.2z"/></svg>
      <span id="emailTopoTexto"></span>
    </a>
  </header>

  <section class="bloco" aria-labelledby="tituloComo">
    <h2 class="rotulo" id="tituloComo">Como funciona</h2>
    <div class="passos" id="passos"></div>
  </section>

  <section class="bloco" aria-labelledby="tituloPacotes">
    <h2 class="rotulo" id="tituloPacotes">Pacotes</h2>
    <div class="pacotes" id="pacotes"></div>
  </section>

  <section class="bloco" aria-labelledby="tituloIncluso">
    <h2 class="rotulo" id="tituloIncluso">Em todos os pacotes</h2>
    <ul class="incluso" id="incluso"></ul>
    <p class="observacao" id="observacao"></p>
  </section>

  <div class="final">
    <strong>Precisa de algo diferente?</strong>
    <span>Me conta o que o seu negócio precisa e eu monto uma proposta sob medida.</span>
    <a class="quero" id="personalizado" target="_blank" rel="noopener" data-goatcounter-click="videomaker-personalizado"></a>
  </div>

  <p class="rodape">Débora Dominique · deboradominique.com</p>
</main>

<a class="fixo" id="botaoFixo" target="_blank" rel="noopener" data-goatcounter-click="videomaker-orcamento-fixo" aria-hidden="true" tabindex="-1"></a>

<script>
// ============================================================
// EDITE AQUI: tudo o que aparece na página
// ============================================================
const WHATSAPP = '5531984042252';
const EMAIL = 'contato@deboradominique.com';

const VIDEOMAKER = {
  subtitulo: 'Eu vou até você, gravo com o celular e entrego Reels editados, prontos para postar e atrair clientes.',
  paraQuem: ['Restaurantes e cafés', 'Lojas', 'Clínicas e estúdios', 'Eventos', 'Prestadores de serviço'],

  passos: [
    { titulo: 'Briefing', texto: 'Entendo o seu negócio e o objetivo' },
    { titulo: 'Captação', texto: 'Gravo no seu espaço' },
    { titulo: 'Entrega', texto: 'Reels editados e prontos' }
  ],

  // destaque: true = cartão vinho | etiqueta é opcional | mensal: true mostra "/mês" no preço
  pacotes: [
    {
      nome: 'Essencial', resumo: 'Para começar a aparecer', preco: 'R$ 600',
      itens: ['1 captação de até 2 horas', '3 Reels editados'],
      mensagem: 'Olá, Débora! Vi seus pacotes de videomaker e quero o pacote Essencial.'
    },
    {
      nome: 'Presença', resumo: 'Conteúdo para o mês inteiro', preco: 'R$ 1.000', etiqueta: 'Melhor custo por vídeo', destaque: true,
      itens: ['1 captação de até 3 horas', '6 Reels editados'],
      mensagem: 'Olá, Débora! Vi seus pacotes de videomaker e quero o pacote Presença.'
    },
    {
      nome: 'Mensal', resumo: 'Seu perfil sempre ativo', preco: 'R$ 1.500', mensal: true,
      itens: ['2 captações por mês, de até 2 horas cada', '8 Reels editados por mês'],
      mensagem: 'Olá, Débora! Vi seus pacotes de videomaker e quero saber mais sobre o pacote Mensal.'
    }
  ],

  incluso: ['Roteiro pensado antes da gravação', 'Equipamento próprio', 'Edição com legendas', 'Trilhas licenciadas', 'Até 2 ajustes por vídeo', 'Entrega em até 10 dias corridos'],
  observacao: 'Atendimento em Belo Horizonte. Para outras cidades, consulte o valor do deslocamento.',
  mensagemPersonalizado: 'Olá, Débora! Vi seus pacotes de videomaker e quero uma proposta personalizada.'
};
// ============================================================

const $ = (id) => document.getElementById(id);
const whats = (msg) => `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;
const ICONE_WHATS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.6-.1l2 .9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
const ICONE_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>';

$('subtitulo').textContent = VIDEOMAKER.subtitulo;
$('emailTopo').href = `mailto:${EMAIL}?subject=${encodeURIComponent('Orçamento de videomaker mobile')}`;
$('emailTopoTexto').textContent = EMAIL;
$('tags').innerHTML = VIDEOMAKER.paraQuem.map((t) => `<span>${t}</span>`).join('');

$('passos').innerHTML = VIDEOMAKER.passos.map((p, i) => `
  <div class="passo"><b>${i + 1}</b><strong>${p.titulo}</strong><span>${p.texto}</span></div>`).join('');

$('pacotes').innerHTML = VIDEOMAKER.pacotes.map((p) => `
  <article class="pacote${p.destaque ? ' destaque' : ''}">
    ${p.etiqueta ? `<span class="etiqueta">${p.etiqueta}</span>` : ''}
    <div class="cabeca">
      <div><h3>${p.nome}</h3><span class="resumo">${p.resumo}</span></div>
      <div class="preco"><small>Investimento</small><b>${p.preco}${p.mensal ? '<i>/mês</i>' : ''}</b></div>
    </div>
    <ul class="itens">${p.itens.map((i) => `<li>${ICONE_CHECK}${i}</li>`).join('')}</ul>
    <a class="quero" href="${whats(p.mensagem)}" target="_blank" rel="noopener" data-goatcounter-click="videomaker-${p.nome}">${ICONE_WHATS} Quero o ${p.nome}</a>
  </article>`).join('');

$('incluso').innerHTML = VIDEOMAKER.incluso.map((i) => `<li>${ICONE_CHECK}${i}</li>`).join('');
$('observacao').textContent = VIDEOMAKER.observacao;
$('personalizado').href = whats(VIDEOMAKER.mensagemPersonalizado);
$('personalizado').innerHTML = `${ICONE_WHATS} Pedir proposta`;

// Botão fixo: aparece depois do topo e some quando a chamada final já está na tela
const fixo = $('botaoFixo');
fixo.href = whats(VIDEOMAKER.mensagemPersonalizado);
fixo.innerHTML = `${ICONE_WHATS} Personalize seu pacote`;
let finalVisivel = false;
const atualizarFixo = () => {
  const mostrar = window.scrollY > 300 && !finalVisivel;
  fixo.classList.toggle('visivel', mostrar);
  fixo.setAttribute('aria-hidden', String(!mostrar));
  fixo.tabIndex = mostrar ? 0 : -1;
};
new IntersectionObserver(([item]) => { finalVisivel = item.isIntersecting; atualizarFixo(); }).observe(document.querySelector('.final'));
window.addEventListener('scroll', atualizarFixo, { passive: true });
atualizarFixo();
</script>

<script>
// Na prévia aberta direto do computador, links de pasta ("../") precisam apontar para o index.html
if (location.protocol === 'file:') {
  document.querySelectorAll('a[href]').forEach((a) => {
    const h = a.getAttribute('href');
    if (!/^([a-z]+:|#)/.test(h) && h.endsWith('/')) a.setAttribute('href', h + 'index.html');
  });
}
</script>
<script>window.goatcounter = { path: (p) => location.host + p };</script>
<script data-goatcounter="https://deboradominique.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
